<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hama Dev - پرسیار و وەڵام و QR</title>
    <!-- کتێبخانەی QR Code کە پشتگیری کوردی دەکات -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            text-align: center;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .row-group {
            display: flex;
            gap: 10px;
        }
        textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #090d16;
            color: #fff;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }
        button:hover {
            background: #0ea5e9;
        }
        .btn-success {
            background: #10b981;
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-warning {
            background: #f59e0b;
            color: #0f172a;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        /* بەشی QR Code */
        #qrcode-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
        }
        #qrcode {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #qrcode img {
            display: block;
            max-width: 200px;
            height: auto;
        }
        /* بەشی یاریی پرسیار و وەڵام */
        .quiz-box {
            background: #090d16;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            text-align: right;
        }
        .question-text {
            font-size: 16px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 15px;
            text-align: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .option-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            transition: background 0.2s;
        }
        .option-btn:hover {
            background: #334155;
            border-color: #38bdf8;
        }
        .quiz-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>Hama Dev - پرسیار و وەڵام و QR</h1>
    <div class="subtitle">یاریی زانیاری گشتی و دروستکەری QR Code</div>

    <!-- بەشی دروستکردنی QR Code -->
    <div class="card">
        <h3>دروستکەری QR Code بۆ خەڵات</h3>
        <div class="input-group" style="margin-top: 15px;">
            <textarea id="qrText" rows="4" placeholder="دەق یان لینک لێرە بنووسە..."></textarea>
            <div class="row-group">
                <button class="btn-success" style="flex: 1;" onclick="generateQR()">دروستکردنی QR</button>
                <button class="btn-warning" style="flex: 1;" onclick="fillRobuxTemplate()">قالبی 200 ڕۆبۆکس</button>
            </div>
        </div>
        
        <div id="qrcode-wrapper">
            <div id="qrcode"></div>
            <button class="btn-success" style="margin-top: 12px;" onclick="downloadQR()">داگرتنی وێنەی QR</button>
        </div>
    </div>

    <!-- یاریی پرسیار و وەڵام (Quiz Game) -->
    <div class="card">
        <h3>یاریی پرسیار و وەڵام</h3>
        
        <div class="quiz-box" id="quizContainer">
            <div class="quiz-stats">
                <span>پرسیار: <span id="currentQuestionNum">1</span> / <span id="totalQuestions">4</span></span>
                <span>خاڵ: <span id="quizScore" style="color: #38bdf8; font-weight: bold;">0</span></span>
            </div>
            
            <div class="question-text" id="questionText">پرسیار لێرە دەردەکەوێت...</div>
            
            <div class="options-grid" id="optionsContainer">
                <!-- هەڵبژاردنەکان لێرە دەردەکەون -->
            </div>
        </div>
        
        <button class="btn-success" id="restartQuizBtn" style="margin-top: 15px; display: none;" onclick="startQuiz()">دووبارە دەستپێکردنەوەی یاری</button>
    </div>

    <script>
        // پڕکردنەوەی قالبی تایبەت بە خەڵاتی 200 ڕۆبۆکس
        function fillRobuxTemplate() {
            const template = `پیرۆزە چات بکە بوویتە خاوەن 200 ڕۆبۆکس لە یاری hama dev\nلینکی یاری:\nhttps://hamadev19.github.io/-hama-dev-/\nچاتت لە بیر نەچێت\nناوی تیکتۆک: .hama_dev`;
            document.getElementById("qrText").value = template;
            generateQR();
        }

        // دروستکردنی QR Code بە پشتگیری تەواوی UTF-8
        function generateQR() {
            const text = document.getElementById("qrText").value.trim();
            const qrContainer = document.getElementById("qrcode");
            const wrapper = document.getElementById("qrcode-wrapper");

            if (!text) {
                alert("تکایە نوسینێک یان لینکێک بنووسە!");
                return;
            }

            const utf8Text = unescape(encodeURIComponent(text));
            const qr = qrcode(0, 'M');
            qr.addData(utf8Text, 'Byte');
            qr.make();

            qrContainer.innerHTML = qr.createImgTag(6, 4);
            wrapper.style.display = "flex";
        }

        // داگرتنی وێنەی QR Code
        function downloadQR() {
            const img = document.querySelector("#qrcode img");
            if (!img) return;
            const link = document.createElement("a");
            link.href = img.src;
            link.download = "hama_dev_qr.gif";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // سیستمی یاریی پرسیار و وەڵام
        const quizData = [
            {
                question: "پایتەختی هەرێمی کوردستان کام شارە؟",
                options: ["سلێمانی", "هەولێر", "دهۆک", "کەرکووک"],
                correct: 1
            },
            {
                question: "کام یاریزانە زۆرترین تۆپی دێڕی (Ballon d'Or) بەدەستهێناوە؟",
                questionEn: "",
                options: ["کریستیانو رۆناڵدۆ", "لیۆنێل مێسی", "نەیمار", "پێلی"],
                correct: 1
            },
            {
                question: "ڕۆبۆکس (Robux) دراوی سەرەکی چ یارییەکە؟",
                options: ["ماینکرافت", "ڕۆبلوکس (Roblox)", "گارینا فری فایەر", "پەبجی"],
                correct: 1
            },
            {
                question: "کۆمپیوتەر زانیارییەکان بە چ شێوازێک دەخوێنێتەوە؟",
                options: ["سیستمی سفر و یەک (Binary)", "پیت و ڕستە", "ژمارەی دەهەیی", "هێڵکاری"],
                correct: 0
            }
        ];

        let currentQIndex = 0;
        let score = 0;

        function startQuiz() {
            currentQIndex = 0;
            score = 0;
            document.getElementById("restartQuizBtn").style.display = "none";
            document.getElementById("quizContainer").style.display = "block";
            document.getElementById("totalQuestions").innerText = quizData.length;
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQIndex >= quizData.length) {
                endQuiz();
                return;
            }

            const q = quizData[currentQIndex];
            document.getElementById("currentQuestionNum").innerText = currentQIndex + 1;
            document.getElementById("quizScore").innerText = score;
            document.getElementById("questionText").innerText = q.question;

            const optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, q.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (selected === correct) {
                score += 10;
                alert("پیرۆزە! وەڵامەکەت ڕاستە.");
            } else {
                alert("وەڵامەکە هەڵە بوو!");
            }
            currentQIndex++;
            loadQuestion();
        }

        function endQuiz() {
            document.getElementById("quizContainer").innerHTML = `
                <div class="question-text" style="color: #38bdf8;">یارییەکە کۆتایی هات! 🎉</div>
                <p style="font-size: 16px; margin-bottom: 15px;">کۆی خاڵەکانت: ${score} لە ${(quizData.length * 10)}</p>
            `;
            document.getElementById("restartQuizBtn").style.display = "inline-block";
        }

        // دانانی قالبی QR لە کاتی کردنەوەی پەڕەکەدا
        window.onload = function() {
            fillRobuxTemplate();
            startQuiz();
        };
    </script>
</body>
</html>
