<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hama Dev - یاری و دروستکەری QR</title>
    <!-- کتێبخانەی QR Code کە پشتگیری یونیکۆد و کوردی دەکات -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            text-align: center;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .row-group {
            display: flex;
            gap: 10px;
        }
        textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #090d16;
            color: #fff;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }
        button:hover {
            background: #0ea5e9;
        }
        .btn-success {
            background: #10b981;
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-warning {
            background: #f59e0b;
            color: #0f172a;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        /* بەشی QR Code */
        #qrcode-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
        }
        #qrcode {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #qrcode img {
            display: block;
            max-width: 200px;
            height: auto;
        }
        /* یارییە نوێیەکە (یاریی تاقیکردنەوەی خێرایی) */
        .game-box {
            background: #090d16;
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            padding: 25px;
            margin-top: 15px;
            cursor: pointer;
            user-select: none;
            transition: background 0.3s;
        }
        .game-box h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .game-box p {
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>Hama Dev - یاری و دروستکەری QR</h1>
    <div class="subtitle">یارییەکی خێرا و سیستمی دروستکردنی QR Code</div>

    <!-- بەشی دروستکردنی QR Code -->
    <div class="card">
        <h3>دروستکەری QR Code بۆ خەڵات</h3>
        <div class="input-group" style="margin-top: 15px;">
            <textarea id="qrText" rows="4" placeholder="دەق یان لینک لێرە بنووسە..."></textarea>
            <div class="row-group">
                <button class="btn-success" style="flex: 1;" onclick="generateQR()">دروستکردنی QR</button>
                <button class="btn-warning" style="flex: 1;" onclick="fillRobuxTemplate()">قالبی 200 ڕۆبۆکس</button>
            </div>
        </div>
        
        <div id="qrcode-wrapper">
            <div id="qrcode"></div>
            <button class="btn-success" style="margin-top: 12px;" onclick="downloadQR()">داگرتنی وێنەی QR</button>
        </div>
    </div>

    <!-- یارییە نوێیەکە: تاقیکردنەوەی خێرایی پەنجە (Reaction Game) -->
    <div class="card">
        <h3>یاریی خێرایی پەنجە (Reaction Test)</h3>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 10px;">ببینە کاتێک ڕەنگەکە دەگۆڕێت، چەندە خێرا کلیک دەکەیت!</p>
        
        <div class="game-box" id="reactionBox" onclick="handleGameClick()">
            <h3 id="gameTitle">بۆ دەستپێکردن کلیک لێرە بکە</h3>
            <p id="gameDesc">ئامادەبە کاتێک ڕەنگەکە سەوز بوو!</p>
        </div>
        
        <div style="margin-top: 15px; font-size: 15px; font-weight: bold;">
            کاتی تۆمارکراو: <span id="resultTime" style="color: #38bdf8;">0</span> مێلی چرکە
        </div>
    </div>

    <script>
        // پڕکردنەوەی قالبی تایبەت بە خەڵاتی 200 ڕۆبۆکس
        function fillRobuxTemplate() {
            const template = `پیرۆزە چات بکە بوویتە خاوەن 200 ڕۆبۆکس لە یاری hama dev\nلینکی یاری:\nhttps://hamadev19.github.io/-hama-dev-/\nچاتت لە بیر نەچێت\nناوی تیکتۆک: .hama_dev`;
            document.getElementById("qrText").value = template;
            generateQR();
        }

        // دروستکردنی QR Code بە پشتگیری تەواوی UTF-8
        function generateQR() {
            const text = document.getElementById("qrText").value.trim();
            const qrContainer = document.getElementById("qrcode");
            const wrapper = document.getElementById("qrcode-wrapper");

            if (!text) {
                alert("تکایە نوسینێک یان لینکێک بنووسە!");
                return;
            }

            const utf8Text = unescape(encodeURIComponent(text));
            const qr = qrcode(0, 'M');
            qr.addData(utf8Text, 'Byte');
            qr.make();

            qrContainer.innerHTML = qr.createImgTag(6, 4);
            wrapper.style.display = "flex";
        }

        // داگرتنی وێنەی QR Code
        function downloadQR() {
            const img = document.querySelector("#qrcode img");
            if (!img) return;
            const link = document.createElement("a");
            link.href = img.src;
            link.download = "hama_dev_qr.gif";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // مۆدڵی یارییە نوێیەکە (خێرایی پەنجە)
        let gameState = "waiting"; // waiting, ready, click
        let startTime, timeoutId;

        const reactionBox = document.getElementById("reactionBox");
        const gameTitle = document.getElementById("gameTitle");
        const gameDesc = document.getElementById("gameDesc");
        const resultTime = document.getElementById("resultTime");

        function handleGameClick() {
            if (gameState === "waiting") {
                gameState = "ready";
                reactionBox.style.background = "#b91c1c"; // سوور
                gameTitle.innerText = "چاوەڕێ بە... سەوز دەبێت!";
                gameDesc.innerText = "هێشتا مەکلیکە تا سەوز دەبێت";

                let randomTime = Math.floor(Math.random() * 2000) + 1500; // نێوان 1.5 بۆ 3.5 چرکە
                timeoutId = setTimeout(() => {
                    gameState = "click";
                    reactionBox.style.background = "#047857"; // سەوز
                    gameTitle.innerText = "ئێستا کلیک بکە! خێرا!";
                    gameDesc.innerText = "کلیک لەسەر ئەم قەفەسە بکە";
                    startTime = new Date().getTime();
                }, randomTime);

            } else if (gameState === "ready") {
                // ئەگەر زوو کلیکی کرد پێش سەوز بوون
                clearTimeout(timeoutId);
                gameState = "waiting";
                reactionBox.style.background = "#090d16";
                gameTitle.innerText = "هەڵە کردت! زوو کلیکت کرد";
                gameDesc.innerText = "بۆ دووبارە دەستپێکردنەوە کلیک لێرە بکە";

            } else if (gameState === "click") {
                // کاتی دروست
                let endTime = new Date().getTime();
                let elapsedTime = endTime - startTime;
                resultTime.innerText = elapsedTime;

                gameState = "waiting";
                reactionBox.style.background = "#090d16";
                gameTitle.innerText = "پیرۆزە! کاتەکەت: " + elapsedTime + " ms";
                gameDesc.innerText = "بۆ جارێکی تر کلیک لێرە بکە";
            }
        }

        // دانانی قالبی QR لە کاتی کردنەوەی پەڕەکەدا
        window.onload = function() {
            fillRobuxTemplate();
        };
    </script>
</body>
</html>
