<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنکۆی کۆنکان و دروستکەری QR - Hama Dev</title>
    <!-- بارکردنی کتێبخانەی QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #090d16;
            color: #fff;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
        .btn-danger {
            background: #f43f5e;
            color: #fff;
        }
        .btn-danger:hover {
            background: #e11d48;
        }
        .btn-success {
            background: #10b981;
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
        }
        /* بەشی QR Code */
        #qrcode {
            display: flex;
            justify-content: center;
            margin-top: 15px;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        /* بەشی ژمارە و بلیتەکان */
        .number-box {
            font-size: 35px;
            font-weight: bold;
            color: #f59e0b;
            background: #090d16;
            border: 2px dashed #f59e0b;
            border-radius: 12px;
            padding: 12px;
            margin: 15px 0;
        }
        .tickets-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .ticket-badge {
            background: #3b82f6;
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        th {
            color: #38bdf8;
        }
        .actions-cell {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .actions-cell button {
            padding: 5px 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>بنکۆی کۆنکان و دروستکەری QR</h1>
    <div class="subtitle">بەستەری سایتەکەت یان هەر تێکستێک بگۆڕە بۆ QR Code</div>

    <!-- بەشی دروستکردنی QR Code -->
    <div class="card">
        <h3>دروستکردنی QR Code ڕاستەوخۆ</h3>
        <div class="input-group" style="margin-top: 15px;">
            <input type="text" id="qrText" placeholder="بەستەری سایت یان تێکست بنووسە..." />
            <button class="btn-success" onclick="generateQR()">درۆستکردن</button>
        </div>
        <div id="qrcode"></div>
    </div>

    <!-- بەشی تیروپشکی ژمارە و بلیتەکان -->
    <div class="card">
        <h3>تیروپشکی ژمارە و ٤ بلیتی جیاواز</h3>
        <div class="number-box" id="displayNumber">---</div>
        <button class="btn-success" onclick="generateRoundTickets()">پێدانی ژمارە و بلیتەکان</button>
        
        <div style="margin-top: 12px; font-weight: bold; color: #cbd5e1; font-size: 13px;">بلیتەکانی ئەم خولە:</div>
        <div class="tickets-container" id="roundTicketsContainer">
            <span style="color: #94a3b8; font-size: 13px;">هێشتا بلیت دروست نەکراوە...</span>
        </div>
    </div>

    <!-- بەشی زیادکردنی یاریزان -->
    <div class="card">
        <div class="input-group">
            <input type="text" id="playerName" placeholder="ناوی یاریزان بنووسە..." />
            <button onclick="addPlayer()">زیادکردنی یاریزان</button>
        </div>
    </div>

    <!-- تابلۆی خاڵەکان -->
    <div class="card" style="max-width: 100%;">
        <table>
            <thead>
                <tr>
                    <th>ناو</th>
                    <th>کۆی خاڵ</th>
                    <th>بلیتەکان</th>
                    <th>کردارەکان</th>
                </tr>
            </thead>
            <tbody id="scoreTableBody">
                <!-- یاریزانەکان لێرە دەردەکەون -->
            </tbody>
        </table>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-danger" onclick="resetScores()" style="flex:1;">سفرکردنەوەی خاڵەکان</button>
            <button onclick="clearAll()" style="flex:1;">سڕینەوەی هەموویان</button>
        </div>
    </div>

    <script>
        // بەشی دروستکردنی QR Code
        let qrInstance = null;
        function generateQR() {
            const text = document.getElementById("qrText").value.trim();
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";

            if (!text) {
                alert("تکایە بەستەر یان تێکستێک بنووسە!");
                return;
            }

            qrInstance = new QRCode(qrContainer, {
                text: text,
                width: 160,
                height: 160,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctErrorLevel: QRCode.CorrectLevel.H
            });
        }

        // بەشی یاری و تیروپشکی بلیتەکان
        let players = JSON.parse(localStorage.getItem("konkan_v4_players")) || [];

        function saveData() {
            localStorage.setItem("konkan_v4_players", JSON.stringify(players));
        }

        function generateRoundTickets() {
            const randomNum = Math.floor(Math.random() * 90) + 10;
            document.getElementById("displayNumber").innerText = randomNum;

            let ticketsContainer = document.getElementById("roundTicketsContainer");
            ticketsContainer.innerHTML = "";

            let generatedTickets = [];
            while(generatedTickets.length < 4) {
                let ticketVal = 200 + (Math.floor(Math.random() * 5) * 50);
                let ticketString = "بلیت " + (generatedTickets.length + 1) + " (" + ticketVal + ")";
                if(!generatedTickets.includes(ticketString)) {
                    generatedTickets.push(ticketString);
                }
            }

            generatedTickets.forEach(t => {
                let span = document.createElement("span");
                span.className = "ticket-badge";
                span.innerText = t;
                ticketsContainer.appendChild(span);
            });
        }

        function addPlayer() {
            const nameInput = document.getElementById("playerName");
            const name = nameInput.value.trim();
            
            if (!name) {
                alert("تکایە ناوی یاریزان بنووسە!");
                return;
            }

            players.push({ name: name, score: 0, ticketsCount: 0 });
            nameInput.value = "";
            saveData();
            renderTable();
        }

        function addScore(index) {
            const points = prompt("چەند خاڵ زیاد دەکەیت بۆ " + players[index].name + "؟");
            if (points !== null && !isNaN(points) && points !== "") {
                players[index].score += parseInt(points);
                players[index].ticketsCount = Math.floor(players[index].score / 200);
                saveData();
                renderTable();
            }
        }

        function deletePlayer(index) {
            if (confirm("دڵنیایت لە سڕینەوەی ئەم یاریزانە؟")) {
                players.splice(index, 1);
                saveData();
                renderTable();
            }
        }

        function resetScores() {
            if (confirm("دڵنیایت هەموو خاڵەکان سفر دەکەیتەوە؟")) {
                players.forEach(p => { p.score = 0; p.ticketsCount = 0; });
                saveData();
                renderTable();
            }
        }

        function clearAll() {
            if (confirm("دڵنیایت لیستەکە بە تەواوی خاوێن دەکەیتەوە؟")) {
                players = [];
                saveData();
                renderTable();
            }
        }

        function renderTable() {
            const tbody = document.getElementById("scoreTableBody");
            tbody.innerHTML = "";

            if (players.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color: #94a3b8;">هیچ یاریزانێک تۆمار نەکراوە.</td></tr>`;
                return;
            }

            players.forEach((player, index) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="font-weight: bold; color: #f8fafc;">${player.name}</td>
                    <td style="color: #38bdf8; font-weight: bold;">${player.score}</td>
                    <td><span style="background: #10b981; padding: 3px 8px; border-radius: 6px; font-size: 12px;">${player.ticketsCount} بلیت</span></td>
                    <td class="actions-cell">
                        <button onclick="addScore(${index})">+ خاڵ</button>
                        <button class="btn-danger" onclick="deletePlayer(${index})">سڕینەوە</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderTable();
    </script>
</body>
</html>
