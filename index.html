<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hama Dev - پلاتفۆرمی یاری و بەڕێوەبەر</title>
    <!-- کتێبخانەی QR Code کە پشتگیری کوردی دەکات -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            text-align: center;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .row-group {
            display: flex;
            gap: 10px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #090d16;
            color: #fff;
            font-size: 14px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }
        button:hover {
            background: #0ea5e9;
        }
        .btn-danger {
            background: #f43f5e;
            color: #fff;
        }
        .btn-danger:hover {
            background: #e11d48;
        }
        .btn-success {
            background: #10b981;
            color: #fff;
        }
        .btn-success:hover {
            background: #059669;
        }
        .btn-warning {
            background: #f59e0b;
            color: #0f172a;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        /* بەشی QR Code */
        #qrcode-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
        }
        #qrcode {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #qrcode img {
            display: block;
            max-width: 200px;
            height: auto;
        }
        /* بەشی یاریی پرسیار و وەڵام */
        .quiz-box {
            background: #090d16;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            text-align: right;
        }
        .question-text {
            font-size: 16px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 15px;
            text-align: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .option-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            transition: background 0.2s;
        }
        .option-btn:hover {
            background: #334155;
            border-color: #38bdf8;
        }
        .quiz-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>Hama Dev - پلاتفۆرمی یاری و بەڕێوەبەر</h1>
    <div class="subtitle">سیستمی چوونەژوورەوە، دروستکردنی QR و زیادکردنی پرسیار</div>

    <!-- 1. بەشی دروستکردنی ئەکاونت و چوونەژوورەوە -->
    <div class="card" id="authCard">
        <h3 id="authTitle">چوونەژوورەوە یان دروستکردنی ئەکاونت</h3>
        <div class="input-group" style="margin-top: 15px;">
            <input type="text" id="usernameInput" placeholder="ناوی بەکارهێنەر (Username)..." />
            <input type="password" id="passwordInput" placeholder="پاسوۆرد (Password)..." />
            <div class="row-group">
                <button class="btn-success" style="flex: 1;" onclick="registerUser()">دروستکردن</button>
                <button class="btn-warning" style="flex: 1;" onclick="loginUser()">چوونەژوورەوە</button>
            </div>
        </div>
    </div>

    <!-- 2. بەشی تایبەتی صاحب (Hama Dev): QR Code و زیادکردنی پرسیار -->
    <div class="card" id="adminPanel" style="display: none; border: 2px solid #38bdf8;">
        <h3 style="color: #38bdf8; margin-bottom: 10px;">👑 پەناڵی بەڕێوەبەر (Hama Dev)</h3>
        
        <!-- بەشی QR -->
        <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 15px;">
            <h4 style="margin-bottom: 10px; font-size: 14px;">دروستکەری QR Code</h4>
            <textarea id="qrText" rows="3" placeholder="دەق یان لینک لێرە بنووسە..."></textarea>
            <div class="row-group" style="margin-top: 10px;">
                <button class="btn-success" style="flex: 1;" onclick="generateQR()">دروستکردنی QR</button>
                <button class="btn-warning" style="flex: 1;" onclick="fillRobuxTemplate()">قالبی 200 ڕۆبۆکس</button>
            </div>
            <div id="qrcode-wrapper">
                <div id="qrcode"></div>
                <button class="btn-success" style="margin-top: 12px;" onclick="downloadQR()">داگرتنی وێنەی QR</button>
            </div>
        </div>

        <!-- بەشی زیادکردنی پرسیار -->
        <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px;">
            <h4 style="margin-bottom: 10px; font-size: 14px;">زیادکردنی پرسیاری نوێ بۆ یارییەکە</h4>
            <div class="input-group">
                <input type="text" id="newQuestionText" placeholder="دەقی پرسیارەکە..." />
                <input type="text" id="opt0" placeholder="هەڵبژاردەی یەکەم (وەڵامی هەڵە)" />
                <input type="text" id="opt1" placeholder="هەڵبژاردەی دووەم (وەڵامی هەڵە یاخود ڕاست)" />
                <input type="text" id="opt2" placeholder="هەڵبژاردەی سێیەم" />
                <input type="text" id="opt3" placeholder="هەڵبژاردەی چوارەم" />
                <select id="correctOptionIndex">
                    <option value="0">وەڵامی ڕاست: هەڵبژاردەی ١</option>
                    <option value="1">وەڵامی ڕاست: هەڵبژاردەی ٢</option>
                    <option value="2">وەڵامی ڕاست: هەڵبژاردەی ٣</option>
                    <option value="3">وەڵامی ڕاست: هەڵبژاردەی ٤</option>
                </select>
                <button class="btn-success" onclick="addNewQuestion()">زیادکردنی پرسیار بۆ یارییەکە</button>
            </div>
        </div>
    </div>

    <!-- 3. بەشی یاریی پرسیار و وەڵام (بۆ هەمووان) -->
    <div class="card" id="gameCard" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 id="welcomeUser" style="color: #38bdf8; font-size: 16px;">خێر هاتیت</h3>
            <button class="btn-danger" style="padding: 5px 10px; font-size: 12px;" onclick="logoutUser()">چوونە دەرەوە</button>
        </div>
        
        <h3>یاریی پرسیار و وەڵام</h3>
        
        <div class="quiz-box" id="quizContainer">
            <div class="quiz-stats">
                <span>پرسیار: <span id="currentQuestionNum">1</span> / <span id="totalQuestions">0</span></span>
                <span>خاڵ: <span id="quizScore" style="color: #38bdf8; font-weight: bold;">0</span></span>
            </div>
            
            <div class="question-text" id="questionText">هیچ پرسیارێک نییە...</div>
            
            <div class="options-grid" id="optionsContainer">
                <!-- هەڵبژاردنەکان لێرە دەردەکەون -->
            </div>
        </div>
        
        <button class="btn-success" id="restartQuizBtn" style="margin-top: 15px; display: none;" onclick="startQuiz()">دووبارە دەستپێکردنەوەی یاری</button>
    </div>

    <script>
        // بنەمای پرسیارەکان (پاشەکەوت دەکرێن لە localStorage بۆ ئەوەی پرسیارە زیادکراوەکان نەمێنن)
        let defaultQuizData = [
            {
                question: "پایتەختی هەرێمی کوردستان کام شارە؟",
                options: ["سلێمانی", "هەولێر", "دهۆک", "کەرکووک"],
                correct: 1
            },
            {
                question: "ڕۆبۆکس (Robux) دراوی سەرەکی چ یارییەکە؟",
                options: ["ماینکرافت", "ڕۆبلوکس (Roblox)", "گارینا فری فایەر", "پەبجی"],
                correct: 1
            }
        ];

        let quizData = JSON.parse(localStorage.getItem("hama_custom_quiz")) || defaultQuizData;

        // پشکنینی دۆخی چوونەژوورەوە لە کاتی کردنەوەی سایت
        window.onload = function() {
            let currentUser = localStorage.getItem("hama_current_user");
            if (currentUser) {
                showApp(currentUser);
            }
        };

        function registerUser() {
            let user = document.getElementById("usernameInput").value.trim();
            let pass = document.getElementById("passwordInput").value.trim();

            if (!user || !pass) {
                alert("تکایە ناو و پاسوۆرد بنووسە!");
                return;
            }

            let users = JSON.parse(localStorage.getItem("hama_users") || "{}");
            if (users[user]) {
                alert("ئەم ناوە پێشتر تۆمار کراوە!");
                return;
            }

            users[user] = pass;
            localStorage.setItem("hama_users", JSON.stringify(users));
            alert("ئەکاونتەکەت دروست کرا! ئێستا دەتوانیت بچیتە ژوورەوە.");
        }

        function loginUser() {
            let user = document.getElementById("usernameInput").value.trim();
            let pass = document.getElementById("passwordInput").value.trim();

            let users = JSON.parse(localStorage.getItem("hama_users") || "{}");
            
            // چوونەژوورەوەی صاحب
            if (user.toLowerCase() === "hama dev" && pass === "1234") {
                setLoginSession(user);
                return;
            }

            if (users[user] && users[user] === pass) {
                setLoginSession(user);
            } else {
                alert("ناوی بەکارهێنەر یان پاسوۆرد هەڵەیە!");
            }
        }

        function setLoginSession(user) {
            localStorage.setItem("hama_current_user", user);
            showApp(user);
        }

        function showApp(user) {
            document.getElementById("authCard").style.display = "none";
            document.getElementById("gameCard").style.display = "block";
            document.getElementById("welcomeUser").innerText = "خێرهاتیت، " + user;

            // تەنها بۆ صاحب (hama dev) پەناڵی بەڕێوەبەر دەردەکەوێت
            if (user.toLowerCase() === "hama dev") {
                document.getElementById("adminPanel").style.display = "block";
                fillRobuxTemplate();
            }

            startQuiz();
        }

        function logoutUser() {
            localStorage.removeItem("hama_current_user");
            location.reload();
        }

        // بەشی زیادکردنی پرسیار لەلایەن صاحبەوە
        function addNewQuestion() {
            let qText = document.getElementById("newQuestionText").value.trim();
            let o0 = document.getElementById("opt0").value.trim();
            let o1 = document.getElementById("opt1").value.trim();
            let o2 = document.getElementById("opt2").value.trim();
            let o3 = document.getElementById("opt3").value.trim();
            let correctIdx = parseInt(document.getElementById("correctOptionIndex").value);

            if (!qText || !o0 || !o1 || !o2 || !o3) {
                alert("تکایە هەموو خانەکانی پرسیار و هەڵبژاردنەکان پڕبکەرەوە!");
                return;
            }

            let newQ = {
                question: qText,
                options: [o0, o1, o2, o3],
                correct: correctIdx
            };

            quizData.push(newQ);
            localStorage.setItem("hama_custom_quiz", JSON.stringify(quizData));

            alert("پرسارەکە بە سەرکەوتوویی بۆ یارییەکە زیاد کرا! 🎉");
            
            // خاوێنکردنەوەی خانەکان
            document.getElementById("newQuestionText").value = "";
            document.getElementById("opt0").value = "";
            document.getElementById("opt1").value = "";
            document.getElementById("opt2").value = "";
            document.getElementById("opt3").value = "";
        }

        // بەشی QR Code
        function fillRobuxTemplate() {
            const template = `پیرۆزە چات بکە بوویتە خاوەن 200 ڕۆبۆکس لە یاری hama dev\nلینکی یاری:\nhttps://hamadev19.github.io/-hama-dev-/\nچاتت لە بیر نەچێت\nناوی تیکتۆک: .hama_dev`;
            document.getElementById("qrText").value = template;
            generateQR();
        }

        function generateQR() {
            const text = document.getElementById("qrText").value.trim();
            const qrContainer = document.getElementById("qrcode");
            const wrapper = document.getElementById("qrcode-wrapper");

            if (!text) {
                alert("تکایە نوسینێک بنووسە!");
                return;
            }

            const utf8Text = unescape(encodeURIComponent(text));
            const qr = qrcode(0, 'M');
            qr.addData(utf8Text, 'Byte');
            qr.make();

            qrContainer.innerHTML = qr.createImgTag(6, 4);
            wrapper.style.display = "flex";
        }

        function downloadQR() {
            const img = document.querySelector("#qrcode img");
            if (!img) return;
            const link = document.createElement("a");
            link.href = img.src;
            link.download = "hama_dev_qr.gif";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // بەشی یاریی پرسیار و وەڵام
        let currentQIndex = 0;
        let score = 0;

        function startQuiz() {
            currentQIndex = 0;
            score = 0;
            document.getElementById("restartQuizBtn").style.display = "none";
            document.getElementById("quizContainer").style.display = "block";
            document.getElementById("totalQuestions").innerText = quizData.length;
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQIndex >= quizData.length) {
                endQuiz();
                return;
            }

            const q = quizData[currentQIndex];
            document.getElementById("currentQuestionNum").innerText = currentQIndex + 1;
            document.getElementById("quizScore").innerText = score;
            document.getElementById("questionText").innerText = q.question;

            const optionsContainer = document.getElementById("optionsContainer");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, q.correct);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (selected === correct) {
                score += 10;
                alert("پیرۆزە! وەڵامەکەت ڕاستە.");
            } else {
                alert("وەڵامەکە هەڵە بوو!");
            }
            currentQIndex++;
            loadQuestion();
        }

        function endQuiz() {
            document.getElementById("quizContainer").innerHTML = `
                <div class="question-text" style="color: #38bdf8;">یارییەکە کۆتایی هات! 🎉</div>
                <p style="font-size: 16px; margin-bottom: 15px;">کۆی خاڵەکانت: ${score} لە ${(quizData.length * 10)}</p>
            `;
            document.getElementById("restartQuizBtn").style.display = "inline-block";
        }
    </script>
</body>
</html>
